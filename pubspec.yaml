name: flappy_bird_game
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flame: ^1.28.1
  flame_audio: ^2.11.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/bird_upflap.png
  windows:
    generate: true
    image_path: assets/images/bird_upflap.png
  macos:
    generate: true
    image_path: assets/images/bird_upflap.png
linux:
  generate: true
  image_path: assets/images/bird_upflap.png
web:
  generate: true
  image_path: assets/images/bird_upflap.png


flutter_lints: ^5.0.0


flutter:

  uses-material-design: true


  assets:
    - assets/images/
    - assets/audio/

  fonts:
      - family: Game
        fonts:
          - asset: assets/fonts/Game.ttf

